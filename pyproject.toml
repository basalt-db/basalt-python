[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "basalt-client"
version = "0.1.0"
description = "Official Python client for Basalt — a from-scratch HTAP database engine (DB-API 2.0 style, dependency-free)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["database", "sql", "htap", "olap", "oltp", "columnar", "dbapi", "basalt"]
authors = [{ name = "Basalt contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
  "Topic :: Database :: Front-Ends",
]

[project.urls]
Homepage = "https://github.com/basalt-db/basalt/tree/main/clients/python"
Repository = "https://github.com/basalt-db/basalt"
Issues = "https://github.com/basalt-db/basalt/issues"

[tool.setuptools]
packages = ["basalt"]
